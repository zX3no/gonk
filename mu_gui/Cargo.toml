[package]
name = "mu_gui"
version = "0.1.0"
edition = "2024"

[features]
profile = ["neoui/profile"]

[dependencies]
neoui = { version = "0.1.0", path = "../../../neoui" }
# neoui = { git = "https://github.com/zfphex/neoui", version = "0.1.0" }
mu_core = { version = "0.4.0", path = "../mu_core" }
mini = { git = "https://github.com/zfphex/mini", version = "0.1.0" }
onmi = { version = "0.1.0", path = "../../onmi", features = ["simd"] }
# Must match neoui's fontdue so Font types are identical for ui.add_font.
fontdue = { git = "https://github.com/zfphex/fontdue", default-features = false }
