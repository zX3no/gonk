[workspace]
resolver = "3"
members = ["mu", "mu_core", "mu_gui", "mu_gui2"]

[profile.release]
debug = true

[profile.dist]
inherits = "release"
opt-level = "z"
debug = false
lto = true   
strip = true
panic = "abort"
codegen-units = 1

[profile.dev.package.zune-core]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.zune-png]
opt-level = 3

[profile.dev.package.zune-inflate]
opt-level = 3

[profile.dev.package.simd-adler32]
opt-level = 3

